<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="build/styles/main.css">
    <title>Aprendendo Grunt</title>
</head>
<body>
    <div class="container">
        <div class="painel-login">
            <h1>Login</h1>
            <form id="loginForm">
                <input type="text" id="username" placeholder="Usuário" required>
                <input type="password" id="password" placeholder="Senha" required>
                <button id="enviar" type="submit">Entrar</button>
            </form>
        </div>
        <div class="info">
            <p>Usuario: admin</p>
            <span>Senha: admin</span>
        </div>
    </div>
    <script src="build/scripts/main.min.js"></script>
</body>
</html>
